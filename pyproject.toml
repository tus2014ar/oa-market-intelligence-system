[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oa-market-intelligence-system"
version = "0.1.0"
description = "OA and RA market intelligence: Zilretta visit share from IQVIA NMTA data, a warehouse, features, models and results"
readme = "README.md"
requires-python = ">=3.12"
# The tested, fully pinned set is requirements.txt (CI and the Docker image install it); these are
# the direct runtime dependencies with the lower bounds the code relies on.
dependencies = [
    "pandas>=3.0",
    "numpy>=2.0",
    "openpyxl",
    "pyarrow",
    "requests",
    "pandera",
    "sqlalchemy>=2.0",
    "scipy",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "joblib",
]

[project.optional-dependencies]
notebooks = ["matplotlib", "seaborn", "jupyter", "ipykernel", "nbformat", "nbconvert"]
dev = ["ruff", "pytest", "pytest-xdist", "filelock"]

[project.scripts]
oa-pipeline = "oa_market_intelligence.pipeline:main"
oa-publish = "oa_market_intelligence.publish:main"
oa-model = "oa_market_intelligence.modeling.run_modelling:main"
oa-external = "oa_market_intelligence.external.__main__:main"
oa-graph = "oa_market_intelligence.knowledge_graph:main"
oa-ask-check = "oa_market_intelligence.serving.qa_check:main"
oa-explain = "oa_market_intelligence.modeling.explain:main"
oa-model-round2 = "oa_market_intelligence.modeling.round2.run:main"
oa-api = "oa_market_intelligence.api.main:main"
oa-track = "oa_market_intelligence.tracking:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "e2e: the real extracts through every stage of the publish run, twice (own CI job)",
]

[tool.dagster]
# `dagster dev` / `dagster job execute` find the job here (docs/orchestration.md). Dagster is an
# optional install (requirements-orchestration.txt); nothing else reads this table.
module_name = "oa_market_intelligence.orchestration"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Notebooks are exploratory EDA artifacts (docs/PROPOSAL.md §11), not shipped library
# code - the sys.path.insert-before-imports idiom they need and the wide print()
# lines they produce don't serve the same purpose the strict import-order/line-length
# rules serve in src/ and tests/, so they're excluded rather than fought.
extend-exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# the page is layout code with long literal strings (headlines, captions); the logic is in src/
"app/*.py" = ["E501"]
