# Monthly publish: rebuilds the whole warehouse from the raw extracts and publishes it.
#
# Safety (src/oa_market_intelligence/publish.py): the build happens in a staging file and is
# swapped in only if every stage and check passes. If anything fails the job turns red, no
# commit is made, and the last good database in data/published/ stays in place.
# On success the new database and run log are committed to main.
#
# NMTA extracts arrive on a ~40-day lag after month end (PROPOSAL.md 19.1), so the 10th of
# each month leaves a comfortable buffer, at 06:00 UTC (a quiet-hours choice, not
# data-driven). There is no live feed during this project: a "new month" means new extracts
# committed to data/raw/ (the rerun path is proven by tests/test_publish.py, not by a demo).
name: Monthly Pipeline

on:
  schedule:
    - cron: "0 6 10 * *"
  workflow_dispatch:  # manual trigger, so a rebuild can be run on demand
    inputs:
      accept_challenger_reason:
        description: "Publish even if the promotion gate refused the refit: the written reason (leave empty for a normal run)"
        required: false
        default: ""

permissions:
  contents: write  # to commit the published database
  id-token: write  # to sign in to AWS without stored keys, to publish the release (DL-124)

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install the project (editable; its dependencies come from requirements.txt)
        run: pip install --no-deps -e .

      # One entry point runs every stage in order (public data check, warehouse, feature tables,
      # model-result tables, swap); the committed public-data subset is checked, not rebuilt,
      # because the 24 GB of raw public files exist only on the author's machine.
      # The promotion gate (DL-126) stops the run before the swap if the refit fails a check. A
      # manual run with a written reason publishes it anyway, and the reason is recorded.
      - name: Rebuild and publish
        env:
          ACCEPT_REASON: ${{ inputs.accept_challenger_reason }}
        run: |
          if [ -n "$ACCEPT_REASON" ]; then
            oa-publish --public-data committed --accept-challenger "$ACCEPT_REASON"
          else
            oa-publish --public-data committed
          fi

      # A published database that is incomplete, or whose results and predictions disagree with
      # each other, is never committed.
      - name: Check the published database
        run: pytest tests/test_published_warehouse.py -q

      - name: Commit the published database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/published
          if git diff --cached --quiet; then
            echo "Nothing to publish."
          else
            git commit -m "Publish warehouse $(date -u +%Y-%m-%d)"
            git push
          fi

      # The release for the API (DL-124): the same warehouse in the private data bucket under a
      # name made from its data version and checksum, then the pointer (latest.json) last, so the
      # API never sees a pointer to a missing or half-written file. Skipped, and nothing changes,
      # until the repository variables AWS_DATA_BUCKET and AWS_DATA_ROLE_ARN are set.
      - name: Prepare the data release (a pointer to this warehouse)
        if: vars.AWS_DATA_BUCKET != '' && vars.AWS_DATA_ROLE_ARN != ''
        id: release
        run: |
          python -m oa_market_intelligence.data_release prepare             data/published/warehouse.db data/published/run_log.jsonl release >> "$GITHUB_OUTPUT"

      - name: Sign in to AWS with the OIDC token
        if: vars.AWS_DATA_BUCKET != '' && vars.AWS_DATA_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DATA_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Publish the release to S3, then move the pointer
        if: vars.AWS_DATA_BUCKET != '' && vars.AWS_DATA_ROLE_ARN != ''
        env:
          BUCKET: ${{ vars.AWS_DATA_BUCKET }}
          KEY: ${{ steps.release.outputs.key }}
          SIZE: ${{ steps.release.outputs.size }}
        run: |
          aws s3 cp data/published/warehouse.db "s3://${BUCKET}/${KEY}" --no-progress
          ACTUAL="$(aws s3api head-object --bucket "$BUCKET" --key "$KEY" --query ContentLength --output text)"
          [ "$ACTUAL" = "$SIZE" ] || { echo "The uploaded file is not the size expected"; exit 1; }
          aws s3 cp release/latest.json "s3://${BUCKET}/latest.json" --no-progress --content-type application/json

      - name: Summarise the run
        if: always()
        env:
          PYTHONPATH: src
        run: python -m oa_market_intelligence.run_summary >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-run-log
          path: data/published/run_log.jsonl
          if-no-files-found: ignore
          retention-days: 90
