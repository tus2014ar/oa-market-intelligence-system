# Monthly publish: rebuilds the whole warehouse from the raw extracts, runs the model stage,
# and publishes the result for the public site (app/streamlit_app.py).
#
# Safety (src/oa_market_intelligence/publish.py): the build happens in a staging file and is
# swapped in only if every stage and check passes. If anything fails the job turns red, no
# commit is made, and the site keeps serving the last good database in data/published/.
# On success the new database and run log are committed to main, which redeploys the site.
# The publish step also computes and stores every Phase 4 result (findings, segment model,
# forecast, direction panel, monitoring status) inside the database file, at full precision.
#
# NMTA extracts arrive on a ~40-day lag after month end (PROPOSAL.md 19.1), so the 10th of
# each month leaves a comfortable buffer, at 06:00 UTC (a quiet-hours choice, not
# data-driven). There is no live feed during this project: a "new month" means new extracts
# committed to data/raw/ (the rerun path is proven by tests/test_publish.py, not by a demo).
name: Monthly Pipeline

on:
  schedule:
    - cron: "0 6 10 * *"
  workflow_dispatch: {}  # manual trigger, so a rebuild can be run on demand

permissions:
  contents: write  # to commit the published database

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # the full publish includes the Phase 4 model fitting
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild and publish
        env:
          PYTHONPATH: src
        run: python -m oa_market_intelligence.publish

      - name: Commit the published database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/published
          if git diff --cached --quiet; then
            echo "Nothing to publish."
          else
            git commit -m "Publish warehouse $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Keep the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-run-log
          path: data/published/run_log.jsonl
          if-no-files-found: ignore
          retention-days: 90
