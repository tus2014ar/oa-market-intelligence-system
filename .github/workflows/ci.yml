name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same pull request cancels the older run, so a stale run never holds up the
# result (runs on main are never cancelled).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # requirements.txt is fully pinned, so every run installs the same packages.
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install the project (editable; its dependencies come from requirements.txt)
        run: pip install --no-deps -e .

      - name: Command smoke test
        run: |
          oa-pipeline --help
          oa-publish --help
          oa-model --help
          oa-external --help

      # The real Excel extracts take about a minute to parse and many tests need them. The parsed
      # result is kept between runs and is rebuilt whenever the raw files or the parser change.
      - name: Cache the parsed real extracts
        uses: actions/cache@v4
        with:
          path: .test_cache
          key: real-ingest-${{ hashFiles('data/raw/*.xlsx', 'src/oa_market_intelligence/ingestion/*.py', 'src/oa_market_intelligence/pipeline.py') }}

      - name: Lint (ruff)
        run: ruff check .

      # Tests run in parallel, one worker per core. The slow real-data parse is done once per run and
      # shared through a file (tests/conftest.py). --durations lists the slowest tests so a slow
      # one is visible in the log.
      # The end-to-end tests run in their own job (below), in parallel with these.
      - name: Test (pytest)
        env:
          OA_TEST_CACHE_DIR: .test_cache
        run: pytest -n auto -m "not e2e" --durations=15

  # The gate for the whole chain: the real extracts through all eight stages of the publish run
  # to the published database, twice. The golden snapshot, the downstream tables, the predictions
  # and the repeatability of every table are checked (tests/test_end_to_end.py).
  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies and the project
        run: |
          pip install -r requirements.txt
          pip install --no-deps -e .

      - name: Cache the parsed real extracts
        uses: actions/cache@v4
        with:
          path: .test_cache
          key: real-ingest-${{ hashFiles('data/raw/*.xlsx', 'src/oa_market_intelligence/ingestion/*.py', 'src/oa_market_intelligence/pipeline.py') }}

      - name: End-to-end (pytest -m e2e)
        env:
          OA_TEST_CACHE_DIR: .test_cache
        run: pytest -m e2e --durations=10

  # The website (docs/site.md): the page is run headlessly with Streamlit's test runner on the
  # committed warehouse and checked for errors, tabs, headline numbers and caveats.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            app/requirements.txt

      - name: Install dependencies, the site's packages and the project
        run: |
          pip install -r requirements.txt
          pip install -r app/requirements.txt
          pip install --no-deps -e .

      - name: Site tests
        run: pytest tests/test_serving_views.py tests/test_serving_data.py tests/test_serving_charts.py tests/test_serving_market_map.py tests/test_site_app.py -q

  # The read-only API (DL-116): its tests run in an environment with only the API's own packages
  # (api/requirements.txt), the same set its container installs, on the committed warehouse.
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install the API's packages and the test tools
        run: pip install -r api/requirements.txt pytest httpx filelock

      - name: API tests
        run: pytest tests/test_api.py tests/test_predictor.py tests/test_data_release.py tests/test_remote_data.py tests/test_api_data_release.py tests/test_api_cache.py tests/test_loadtest.py -q

  # Experiment tracking (DL-125): MLflow is an optional install (requirements-tracking.txt), so its
  # tests have their own job; the main job skips them where MLflow is absent. It also builds the
  # real store from the committed warehouse and lists the champions, as a person would.
  tracking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MLflow and what the tests need
        run: pip install pandas sqlalchemy numpy pytest filelock -r requirements-tracking.txt

      - name: Tracking tests
        run: pytest tests/test_tracking.py -q

      - name: Build the real store and list the champions
        run: |
          PYTHONPATH=src python -m oa_market_intelligence.tracking build --store "$RUNNER_TEMP/store"
          PYTHONPATH=src python -m oa_market_intelligence.tracking summary --store "$RUNNER_TEMP/store"

  # The orchestrated publish run (DL-128): Dagster is an optional install (requirements-orchestration.txt),
  # so its tests have their own job; the main job skips them where Dagster is absent. Installed
  # together with the pinned packages (one resolve), as the orchestrator image does.
  orchestration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-orchestration.txt

      - name: Install the pinned packages, Dagster and the project
        run: |
          pip install -r requirements.txt -r requirements-orchestration.txt pytest filelock
          pip install --no-deps -e .

      - name: Publish-run and orchestration tests
        run: pytest tests/test_publish_run.py tests/test_orchestration.py -q

      - name: The job loads as a person would load it
        run: dagster job list -m oa_market_intelligence.orchestration

  # Builds the three images (no push) and runs them, so a broken Dockerfile, pin file or start-up
  # fails here: the pipeline image, the website and the API, each checked as it would run.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the pipeline image
        run: docker build -t oa-market-intelligence .

      - name: Smoke test the pipeline image
        run: |
          docker run --rm oa-market-intelligence oa-publish --help
          docker run --rm oa-market-intelligence oa-model --help
          docker run --rm oa-market-intelligence python -c "import oa_market_intelligence, pandas; print(pandas.__version__)"

      - name: Build the website and API images
        run: |
          docker build -f Dockerfile.site -t oa-site .
          docker build -f Dockerfile.api -t oa-api .

      - name: Run the API image, with a key, and check it
        run: |
          docker run -d --name api -e API_KEYS=ci-key -p 8000:8000 oa-api
          for i in $(seq 1 30); do curl -fs http://localhost:8000/health && break; sleep 2; done
          curl -fs http://localhost:8000/health | grep -q '"auth":"api-key"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/v1/status)" = "401"
          curl -fs -H "X-API-Key: ci-key" http://localhost:8000/v1/status | grep -q "Jul 2025"
          test "$(docker exec api id -u)" != "0"
          docker logs api | tail -5
          docker rm -f api

      - name: Build the Lambda image and call it as Lambda does
        run: |
          docker build -f Dockerfile.lambda -t oa-api-lambda .
          docker run -d --name lambda --read-only --tmpfs /tmp -p 9000:8080 -e API_KEYS=ci-key oa-api-lambda
          event() { printf '{"version":"2.0","routeKey":"$default","rawPath":"%s","rawQueryString":"","headers":{"x-api-key":"%s"},"requestContext":{"http":{"method":"GET","path":"%s","sourceIp":"203.0.113.9"}},"isBase64Encoded":false}' "$1" "$2" "$1"; }
          call() { curl -fs -XPOST "http://localhost:9000/2015-03-31/functions/function/invocations" -d "$(event "$1" "$2")"; }
          for i in $(seq 1 30); do call /health "" | grep -q '"statusCode": 200' && break; sleep 2; done
          call /health "" | grep -q '"statusCode": 200'
          call /v1/models "" | grep -q '"statusCode": 401'
          call /v1/models ci-key | grep -q 'segment:1'
          docker logs lambda | tail -5
          docker rm -f lambda

      - name: Run the website image and check its health
        run: |
          docker run -d --name site -p 8501:8501 oa-site
          for i in $(seq 1 40); do curl -fs http://localhost:8501/_stcore/health && break; sleep 3; done
          test "$(curl -fs http://localhost:8501/_stcore/health)" = "ok"
          test "$(docker exec site id -u)" != "0"
          docker logs site | tail -5
          docker rm -f site
