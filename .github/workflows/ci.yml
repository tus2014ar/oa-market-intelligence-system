name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same pull request cancels the older run, so a stale run never holds up the
# result (runs on main are never cancelled).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # requirements.txt is fully pinned, so every run installs the same packages.
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install the project (editable; its dependencies come from requirements.txt)
        run: pip install --no-deps -e .

      - name: Command smoke test
        run: |
          oa-pipeline --help
          oa-publish --help
          oa-model --help
          oa-external --help

      # The real Excel extracts take about a minute to parse and many tests need them. The parsed
      # result is kept between runs and is rebuilt whenever the raw files or the parser change.
      - name: Cache the parsed real extracts
        uses: actions/cache@v4
        with:
          path: .test_cache
          key: real-ingest-${{ hashFiles('data/raw/*.xlsx', 'src/oa_market_intelligence/ingestion/*.py', 'src/oa_market_intelligence/pipeline.py') }}

      - name: Lint (ruff)
        run: ruff check .

      # Tests run in parallel, one worker per core. The slow real-data parse is done once per run and
      # shared through a file (tests/conftest.py). --durations lists the slowest tests so a slow
      # one is visible in the log.
      - name: Test (pytest)
        env:
          OA_TEST_CACHE_DIR: .test_cache
        run: pytest -n auto --durations=15

  # Builds the project image (no push) and runs it, so a broken Dockerfile or pin file fails here.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t oa-market-intelligence .

      - name: Smoke test the image
        run: |
          docker run --rm oa-market-intelligence oa-publish --help
          docker run --rm oa-market-intelligence oa-model --help
          docker run --rm oa-market-intelligence python -c "import oa_market_intelligence, pandas; print(pandas.__version__)"
