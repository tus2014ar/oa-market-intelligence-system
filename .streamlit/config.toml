# The site's look, taken from the labour-market reference site (DL-112): white, one blue,
# system fonts, bold headings. Light only: that blue does not read on a dark background.
# Secrets never go in this file: they live in .streamlit/secrets.toml, which git ignores.

[theme]
base = "light"
font = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
primaryColor = "#0d47a1"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F7FA"
textColor = "#353639"
linkColor = "#0d47a1"
borderColor = "#E8EBF0"
baseRadius = "0.75rem"
headingFontSizes = ["2rem", "1.5rem", "1.25rem", "1.125rem", "1.125rem", "0.875rem"]
headingFontWeights = [700, 700, 700, 700, 700, 700]

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F7FA"

[browser]
gatherUsageStats = false
